spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.mariadb.jdbc.Driver}
  h2:
    console:
      enabled: false
  thymeleaf:
    cache: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    user-password: ${APP_SEED_USER_PASSWORD:}
