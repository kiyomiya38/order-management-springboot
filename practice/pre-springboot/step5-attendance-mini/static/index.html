<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤怠ミニ</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>勤怠ミニ</h1>
      <p class="muted">状態遷移 + 履歴 + ユーザー一覧UI改善</p>
    </header>

    <section class="panel">
      <div class="row">
        <label>対象ユーザー
          <select id="active-user-select"></select>
        </label>
        <span id="active-user-role" class="muted"></span>
      </div>
      <p id="global-message" class="muted"></p>
    </section>

    <section class="panel">
      <h2>本日の勤怠</h2>
      <div class="status-grid">
        <div>
          <p class="label">日付</p>
          <p id="today-date" class="value">-</p>
        </div>
        <div>
          <p class="label">状態</p>
          <p id="today-status" class="value">未出勤</p>
        </div>
        <div>
          <p class="label">出勤時刻</p>
          <p id="today-start" class="value">-</p>
        </div>
        <div>
          <p class="label">退勤時刻</p>
          <p id="today-end" class="value">-</p>
        </div>
      </div>
      <div class="row">
        <button id="clock-in-btn" type="button">出勤</button>
        <button id="clock-out-btn" type="button">退勤</button>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <h2>勤怠履歴</h2>
        <span id="history-count" class="muted"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>出勤時刻</th>
            <th>退勤時刻</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </section>

    <section class="panel">
      <div class="row">
        <h2>ユーザー管理（UI改善）</h2>
        <span id="user-count" class="muted"></span>
      </div>
      <div class="row filter-row">
        <label>ユーザー名検索
          <input id="user-search-input" type="search" placeholder="例: user">
        </label>
        <label>ロール絞り込み
          <select id="role-filter-select">
            <option value="">すべて</option>
            <option value="ROLE_USER">ROLE_USER</option>
            <option value="ROLE_ADMIN">ROLE_ADMIN</option>
          </select>
        </label>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ユーザー名</th>
            <th>ロール</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="user-body"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
