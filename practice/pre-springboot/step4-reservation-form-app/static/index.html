<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約フォームアプリ</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>予約フォームアプリ</h1>
      <p class="muted">予約作成 / 一覧 / キャンセル / 重複予約禁止</p>
    </header>

    <section class="panel">
      <h2>予約登録</h2>
      <form id="reservation-form" class="grid-form">
        <label>名前
          <input id="name" type="text" maxlength="40" placeholder="例: 山田 太郎" required>
        </label>
        <label>日付
          <input id="date" type="date" required>
        </label>
        <label>開始時刻
          <input id="start-time" type="time" required>
        </label>
        <label>終了時刻
          <input id="end-time" type="time" required>
        </label>
        <label>メモ（任意）
          <input id="note" type="text" maxlength="100" placeholder="例: 面談">
        </label>
        <button type="submit">予約する</button>
      </form>
      <p id="message" class="muted"></p>
    </section>

    <section class="panel">
      <div class="row">
        <h2>予約一覧</h2>
        <span id="count" class="muted"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>名前</th>
            <th>日付</th>
            <th>時間</th>
            <th>メモ</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="reservation-body"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
