<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greeting Web</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <h1>Greeting Web</h1>
    <p class="muted">Java + HTML/CSS/JavaScript の最小Webアプリ</p>

    <form id="greeting-form">
      <label for="name">名前</label>
      <input id="name" name="name" type="text" placeholder="例: Taro" required>
      <button type="submit">送信</button>
    </form>

    <section class="panel">
      <h2>結果</h2>
      <p id="result-message">ここにメッセージが表示されます。</p>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
